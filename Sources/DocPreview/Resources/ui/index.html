<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DocPreview</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-title"><span id="sidebar-name"></span><button id="toggle-hidden" class="icon-btn" title="隠しフォルダ（.claude など）を表示"></button></div>
    <div id="tree"></div>
  </aside>
  <main id="main">
    <div id="empty">左のツリーからファイルを選択してください</div>
    <iframe id="doc" hidden></iframe>
    <div id="findbar" hidden>
      <input id="find-input" type="text" placeholder="ファイル内を検索" spellcheck="false" autocomplete="off">
      <button id="find-case" class="toggle" title="大文字小文字を区別">Aa</button>
      <button id="find-regex" class="toggle" title="正規表現">.*</button>
      <span id="find-count"></span>
      <button id="find-prev" title="前へ (⇧⌘G)">▲</button>
      <button id="find-next" title="次へ (⌘G)">▼</button>
      <button id="find-close" title="閉じる (Esc)">✕</button>
    </div>
  </main>
  <div class="resizer" id="rz-left" title="ドラッグで幅を調整（ダブルクリックでリセット）"></div>
  <div class="resizer" id="rz-right" title="ドラッグで幅を調整（ダブルクリックでリセット）"></div>
  <aside id="comments">
    <div id="comments-head">
      <span>コメント <span id="comment-count"></span></span>
      <button id="send" title="このファイルの未送信コメントを Claude Code に渡す">Claude Code に依頼</button>
    </div>
    <div id="comment-list"></div>
  </aside>
</div>
<button id="add-btn" hidden>💬 コメント</button>
<div id="popover" hidden>
  <blockquote id="pop-quote"></blockquote>
  <textarea id="pop-text" rows="4" placeholder="コメントを入力（⌘+Enter で追加）"></textarea>
  <div class="row"><button id="pop-cancel">キャンセル</button><button id="pop-ok" class="primary">追加</button></div>
</div>
<div id="modal" hidden>
  <div id="settings">
    <h3>設定</h3>
    <label>テーマ <select id="set-theme"><option value="light">ライト (Tokyo Night Light)</option><option value="dark">ダーク (Tokyo Night)</option><option value="system">システム</option></select></label>
    <label>フォントサイズ (px) <input id="set-font" type="number" min="10" max="32" step="1"></label>
    <div class="row"><button id="set-close" class="primary">閉じる</button></div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
